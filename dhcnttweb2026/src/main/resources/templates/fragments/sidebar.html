<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>
<aside th:fragment="sidebar(activeMenu)" class="admin-sidebar">
    <div class="sidebar-brand">
        <a th:href="@{/admin/dashboard}" class="brand-link">
            <span> Store Admin</span>
        </a>
        <span class="sidebar-badge">2026</span>
    </div>

    <div class="sidebar-section-label">QUẢN TRỊ HỆ THỐNG</div>
    <nav class="sidebar-nav">
        <a th:href="@{/admin/dashboard}" class="sidebar-link" th:classappend="${activeMenu == 'dashboard'} ? 'active'">
            <span>▣</span>
            <span>Trang Dashboard</span>
        </a>
        <a th:href="@{/admin/products}" class="sidebar-link" th:classappend="${activeMenu == 'products'} ? 'active'">
            <span>❖</span>
            <span>Quản lý sản phẩm</span>
        </a>
    </nav>

    <div class="sidebar-section-label" style="margin-top:28px;">DANH MỤC THIẾT BỊ</div>
    <nav class="sidebar-nav">
        <a th:href="@{/admin/products(category='iPhone')}" class="sidebar-sublink">iPhone Flagship</a>
        <a th:href="@{/admin/products(category='Mac')}" class="sidebar-sublink">MacBook & Mac Studio</a>
        <a th:href="@{/admin/products(category='iPad')}" class="sidebar-sublink">iPad Pro & Air</a>
        <a th:href="@{/admin/products(category='Phụ kiện')}" class="sidebar-sublink">Âm thanh & Phụ kiện</a>
    </nav>

    <div class="sidebar-footer">
        <div class="admin-profile">
            <div class="admin-avatar">AD</div>
            <div style="flex:1;">
                <div class="admin-name" th:text="${session.ADMIN_USER != null ? session.ADMIN_USER : 'Quản trị viên'}">Admin</div>
                <div class="admin-role">Đang hoạt động</div>
            </div>
            <a th:href="@{/admin/logout}" class="sidebar-logout-btn">Thoát</a>
        </div>
    </div>
</aside>
</body>
</html>
