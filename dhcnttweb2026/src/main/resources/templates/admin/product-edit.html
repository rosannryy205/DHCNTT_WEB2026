<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/header :: head('Chỉnh sửa sản phẩm')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/header :: topbar(${pageTitle}, ${subtitle})}"></header>
        <section class="tile-light">
            <div class="container-admin">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
                    <a th:href="@{/admin/products}" class="text-link" style="display:inline-flex;align-items:center;gap:6px;font-weight:500;">
                        <span>‹ Quay lại danh sách sản phẩm</span>
                    </a>
                    <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này khỏi hệ thống?');">
                        <button type="submit" class="btn-dark-utility">Xóa sản phẩm này</button>
                    </form>
                </div>

                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;">
                    <a th:each="item : ${allProducts}"
                       th:href="@{/admin/products/edit/{id}(id=${item.id})}"
                       class="configurator-option-chip"
                       th:classappend="${item.id == product.id} ? 'selected'"
                       th:text="${item.name}"></a>
                </div>

                <form th:action="@{/admin/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post">
                    <div class="form-grid">
                        <div class="store-utility-card">
                            <h3 class="t-body-strong" style="margin-bottom:16px;border-bottom:1px solid var(--color-hairline);padding-bottom:8px;">
                                1. Thông tin dòng sản phẩm (Bảng Products)
                            </h3>

                            <div class="form-group">
                                <label class="form-label">Tên sản phẩm *</label>
                                <input type="text" id="productName" th:field="*{name}" class="form-control" required/>
                            </div>

                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">Đường dẫn Slug (URL) *</label>
                                    <input type="text" th:field="*{slug}" class="form-control"/>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Thương hiệu (Brand) *</label>
                                    <select th:field="*{brand}" class="form-control">
                                        <option value="Apple">Apple</option>
                                        <option value="Beats">Beats</option>
                                        <option value="Khác">Khác</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">Danh mục (Category) *</label>
                                    <select th:field="*{category}" class="form-control">
                                        <option value="iPhone">iPhone</option>
                                        <option value="Mac">Mac</option>
                                        <option value="iPad">iPad</option>
                                        <option value="Phụ kiện">Phụ kiện</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Trạng thái (is_active) *</label>
                                    <select th:field="*{status}" class="form-control">
                                        <option value="Đang bán">Đang bán (Active)</option>
                                        <option value="Sắp ra mắt">Sắp ra mắt</option>
                                        <option value="Tạm hết hàng">Tạm hết hàng</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Mô tả sản phẩm (Description / Tagline)</label>
                                <textarea th:field="*{tagline}" class="form-control" rows="2"></textarea>
                            </div>

                            <h3 class="t-body-strong" style="margin:24px 0 16px;border-bottom:1px solid var(--color-hairline);padding-bottom:8px;">
                                2. Cấu hình & Phiên bản (Bảng Product_Variants)
                            </h3>

                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">Mã SKU phiên bản *</label>
                                    <input type="text" th:field="*{sku}" class="form-control numeric" required/>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Màu sắc (Color)</label>
                                    <input type="text" th:field="*{color}" class="form-control"/>
                                </div>
                            </div>

                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">Dung lượng lưu trữ (Storage)</label>
                                    <input type="text" th:field="*{storage}" class="form-control"/>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Bộ nhớ RAM (RAM)</label>
                                    <input type="text" th:field="*{ram}" class="form-control"/>
                                </div>
                            </div>

                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">Giá gốc niêm yết (VNĐ)</label>
                                    <input type="number" th:field="*{originalPrice}" class="form-control numeric" min="0" step="10000"/>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Giá bán thực tế (VNĐ) *</label>
                                    <input type="number" th:field="*{price}" class="form-control numeric" min="0" step="10000" required/>
                                </div>
                            </div>

                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">Số lượng tồn kho (Stock) *</label>
                                    <input type="number" th:field="*{stock}" class="form-control numeric" min="0" required/>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">URL Ảnh Render (Image)</label>
                                    <input type="url" id="productImgInput" th:field="*{imageUrl}" class="form-control"/>
                                </div>
                            </div>
                        </div>

                        <div class="store-utility-card" style="background:var(--color-surface-pearl);text-align:center;align-self:start;">
                            <span class="t-fine-print" style="color:var(--color-primary);text-transform:uppercase;font-weight:600;">Đang chỉnh sửa</span>
                            <div style="margin:20px 0;">
                                <img id="productPreviewImg" class="product-render-img" th:src="${product.imageUrl}" th:alt="${product.name}"/>
                            </div>
                            <h4 id="previewName" class="t-body-strong" style="margin-top:8px;" th:text="${product.name}"></h4>
                            <p class="t-caption" style="color:var(--color-ink-muted-48);margin-top:4px;" 
                               th:text="${(product.color != null ? product.color : '') + ' • ' + (product.storage != null ? product.storage : '')}"></p>
                            <p class="numeric t-body-strong" style="margin-top:8px;" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></p>
                        </div>
                    </div>

                    <div class="floating-sticky-bar">
                        <span class="t-body-strong" th:text="'Đang sửa: ' + ${product.name}"></span>
                        <div style="display:flex;gap:12px;">
                            <a th:href="@{/admin/products}" class="btn-secondary-pill">Hủy thay đổi</a>
                            <button type="submit" class="btn-primary">Cập nhật sản phẩm</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
<script>
    const imgInput = document.getElementById('productImgInput');
    const previewImg = document.getElementById('productPreviewImg');
    if (imgInput && previewImg) {
        imgInput.addEventListener('input', function() {
            if (this.value) previewImg.src = this.value;
        });
    }
</script>
</body>
</html>
