<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/header :: head('Quản lý danh mục')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/header :: topbar(${pageTitle}, ${subtitle})}"></header>
        <section class="tile-light" style="padding-bottom:36px;">
            <div class="container-admin">
                <!-- Thông báo thành công -->
                <div th:if="${successMessage}" style="background:var(--color-canvas-parchment);padding:12px 20px;border-radius:var(--rounded-pill);margin-bottom:20px;border:1px solid var(--color-hairline);">
                    <span class="t-caption-strong" style="color:var(--color-primary);" th:text="${successMessage}"></span>
                </div>
                <!-- Thông báo lỗi -->
                <div th:if="${errorMessage}" style="background:#fee2e2;padding:12px 20px;border-radius:var(--rounded-pill);margin-bottom:20px;border:1px solid #f87171;">
                    <span class="t-caption-strong" style="color:#b91c1c;" th:text="${errorMessage}"></span>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
                    <form th:action="@{/admin/categories}" method="get" style="display:flex;gap:12px;align-items:center;">
                        <input type="text" name="keyword" class="search-input" placeholder="Tìm tên danh mục..." th:value="${keyword}"/>
                        <button type="submit" class="btn-secondary-pill">Tìm kiếm</button>
                    </form>
                    <a th:href="@{/admin/categories/add}" class="btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
                        <span>＋ Thêm danh mục mới</span>
                    </a>
                </div>
            </div>
        </section>

        <section class="tile-parchment" style="padding-top:36px;">
            <div class="container-admin">
                <div class="spec-table-container">
                    <table class="spec-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Ảnh</th>
                                <th>Tên danh mục</th>
                                <th>Đường dẫn Slug</th>
                                <th>Danh mục cha</th>
                                <th>Số sản phẩm</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${categories == null or categories.isEmpty()}">
                                <td colspan="8" style="text-align:center;padding:32px;color:var(--color-ink-muted-48);">
                                    Không tìm thấy danh mục nào trong CSDL.
                                </td>
                            </tr>
                            <tr th:each="c : ${categories}">
                                <td class="numeric" th:text="${c.id}"></td>
                                <td>
                                    <img th:if="${c.image != null and !c.image.isBlank()}" 
                                         th:src="${c.image}" th:alt="${c.name}" 
                                         style="width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px;padding:4px;border:1px solid var(--color-hairline);"/>
                                    <span th:if="${c.image == null or c.image.isBlank()}" style="color:var(--color-ink-muted-48);">—</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/categories/{id}(id=${c.id})}" class="text-link t-body-strong" th:text="${c.name}"></a>
                                </td>
                                <td class="numeric t-caption" style="color:var(--color-ink-muted-48);" th:text="${c.slug}"></td>
                                <td th:text="${c.parentName}"></td>
                                <td class="numeric">
                                    <span class="t-caption-strong" style="background:#e0f2fe;color:#0369a1;padding:4px 10px;border-radius:12px;" th:text="${c.productCount} + ' SP'"></span>
                                </td>
                                <td>
                                    <span th:if="${c.isActive}" style="color:#16a34a;font-weight:600;font-size:13px;">● Hoạt động</span>
                                    <span th:unless="${c.isActive}" style="color:#9ca3af;font-weight:600;font-size:13px;">○ Tạm ẩn</span>
                                </td>
                                <td style="display:flex;gap:12px;align-items:center;">
                                    <a th:href="@{/admin/categories/{id}(id=${c.id})}" class="text-link" style="color:#0284c7;">Chi tiết</a>
                                    <a th:href="@{/admin/categories/edit/{id}(id=${c.id})}" class="text-link" style="font-weight:600;">Sửa</a>
                                    <form th:action="@{/admin/categories/delete/{id}(id=${c.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="text-link" style="color:#dc2626;" 
                                                onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này? Hệ thống sẽ kiểm tra ràng buộc sản phẩm trước khi xóa.');">
                                            Xóa
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</div>
</body>
</html>
