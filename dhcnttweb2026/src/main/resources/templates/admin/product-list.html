<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/header :: head('Danh sách sản phẩm')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/header :: topbar(${pageTitle}, ${subtitle})}"></header>
        <section class="tile-light" style="padding-bottom:36px;">
            <div class="container-admin">
                <!-- Thông báo thành công -->
                <div th:if="${successMessage}" style="background:var(--color-canvas-parchment);padding:12px 20px;border-radius:var(--rounded-pill);margin-bottom:20px;border:1px solid var(--color-hairline);">
                    <span class="t-caption-strong" style="color:var(--color-primary);" th:text="${successMessage}"></span>
                </div>
                <!-- Thông báo lỗi -->
                <div th:if="${errorMessage}" style="background:#fee2e2;padding:12px 20px;border-radius:var(--rounded-pill);margin-bottom:20px;border:1px solid #f87171;">
                    <span class="t-caption-strong" style="color:#b91c1c;" th:text="${errorMessage}"></span>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
                    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                        <form th:action="@{/admin/products}" method="get" style="display:flex;gap:12px;">
                            <input type="hidden" name="category" th:value="${selectedCategory}"/>
                            <input type="text" name="keyword" class="search-input" placeholder="Tìm theo tên, SKU, hãng..." th:value="${keyword}"/>
                            <button type="submit" class="btn-secondary-pill">Tìm kiếm</button>
                        </form>
                        <a th:href="@{/admin/products/add}" class="btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
                            <span>＋ Thêm sản phẩm mới</span>
                        </a>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <a th:href="@{/admin/products(category='ALL', keyword=${keyword})}" class="configurator-option-chip" th:classappend="${selectedCategory == 'ALL' or selectedCategory == ''} ? 'selected'">Tất cả</a>
                        <a th:each="cat : ${categoryOptions}" 
                           th:href="@{/admin/products(category=${cat.name}, keyword=${keyword})}" 
                           class="configurator-option-chip" 
                           th:classappend="${selectedCategory == cat.name} ? 'selected'"
                           th:text="${cat.name}">iPhone</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="tile-parchment" style="padding-top:36px;">
            <div class="container-admin">
                <div class="product-gallery-grid">
                    <article class="store-utility-card" th:each="p : ${products}">
                        <div>
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span class="t-fine-print" style="color:var(--color-ink-muted-48);" th:text="${(p.brand != null ? p.brand : 'Apple') + ' • ' + p.category}"></span>
                                <span th:if="${p.status == 'Đang bán'}" class="status-chip status-chip-active" style="padding:2px 8px;font-size:11px;">
                                    <svg class="status-chip-icon" viewBox="0 0 16 16" width="11" height="11" fill="currentColor" aria-hidden="true">
                                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                                    </svg>
                                    <span>Đang bán</span>
                                </span>
                                <span th:unless="${p.status == 'Đang bán'}" class="status-chip status-chip-inactive" style="padding:2px 8px;font-size:11px;">
                                    <svg class="status-chip-icon" viewBox="0 0 16 16" width="11" height="11" fill="currentColor" aria-hidden="true">
                                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                        <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                                    </svg>
                                    <span th:text="${p.status}">Ngừng kinh doanh</span>
                                </span>
                            </div>
                            <img class="product-render-img" th:src="${p.imageUrl}" th:alt="${p.name}"/>
                            <h3 class="t-body-strong" th:text="${p.name}"></h3>
                            <p class="t-caption" style="color:var(--color-ink-muted-48);margin-top:4px;" 
                               th:text="${p.color != null ? p.color + ' • ' + (p.storage != null ? p.storage : '') : p.tagline}"></p>
                        </div>
                        <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--color-divider-soft);display:flex;justify-content:space-between;align-items:center;">
                            <div>
                                <span class="numeric t-body-strong" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></span>
                                <span th:if="${p.originalPrice > p.price}" class="numeric t-fine-print" style="text-decoration:line-through;color:var(--color-ink-muted-48);margin-left:6px;" th:text="${#numbers.formatDecimal(p.originalPrice, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></span>
                            </div>
                            <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="text-link" style="font-weight:600;">Chỉnh sửa ›</a>
                        </div>
                    </article>
                </div>

                <h3 class="t-tagline" style="margin:48px 0 16px;">Bảng thông số tồn kho & quy cách CSDL</h3>
                <div class="spec-table-container">
                    <table class="spec-table">
                        <thead>
                            <tr>
                                <th class="col-id">ID</th>
                                <th>Sản phẩm</th>
                                <th class="col-sku">Mã SKU</th>
                                <th>Danh mục & Hãng</th>
                                <th>Màu & Bộ nhớ</th>
                                <th class="col-price">Giá bán</th>
                                <th class="col-stock">Tồn kho</th>
                                <th class="col-status">Trạng thái</th>
                                <th class="col-actions">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${products == null or products.isEmpty()}">
                                <td colspan="9" style="text-align:center;padding:32px;color:var(--color-ink-muted-48);">
                                    Không tìm thấy sản phẩm nào trong CSDL.
                                </td>
                            </tr>
                            <tr th:each="p : ${products}">
                                <td class="numeric col-id" th:text="${p.id}"></td>
                                <td>
                                    <div class="t-body-strong" th:text="${p.name}"></div>
                                    <div class="t-fine-print" style="color:var(--color-ink-muted-48);" th:text="'slug: ' + ${p.slug}"></div>
                                </td>
                                <td class="numeric t-caption col-sku" th:text="${p.sku}"></td>
                                <td th:text="${p.category + ' (' + (p.brand != null ? p.brand : 'Apple') + ')'}"></td>
                                <td class="t-caption" th:text="${(p.color != null ? p.color : '-') + ' / ' + (p.storage != null ? p.storage : '-')}"></td>
                                <td class="numeric col-price">
                                    <div class="t-body-strong" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></div>
                                    <div th:if="${p.originalPrice > p.price}" class="t-fine-print" style="text-decoration:line-through;color:var(--color-ink-muted-48);" th:text="${#numbers.formatDecimal(p.originalPrice, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></div>
                                </td>
                                <td class="numeric col-stock">
                                    <span class="stock-badge" th:text="${p.stock}"></span>
                                </td>
                                <td class="col-status">
                                    <span th:if="${p.status == 'Đang bán'}" class="status-chip status-chip-active" title="Đang bán">
                                        <svg class="status-chip-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true">
                                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                                        </svg>
                                        <span>Đang bán</span>
                                    </span>
                                    <span th:unless="${p.status == 'Đang bán'}" class="status-chip status-chip-inactive" th:title="${p.status}">
                                        <svg class="status-chip-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true">
                                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                                        </svg>
                                        <span th:text="${p.status}">Ngừng kinh doanh</span>
                                    </span>
                                </td>
                                <td class="col-actions">
                                    <div class="table-actions">
                                        <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" 
                                           class="table-action-btn action-edit" 
                                           title="Chỉnh sửa sản phẩm" 
                                           aria-label="Chỉnh sửa">
                                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                            </svg>
                                        </a>
                                        <form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post" style="display:inline;margin:0;">
                                            <button type="submit" 
                                                    class="table-action-btn action-delete" 
                                                    title="Xóa sản phẩm" 
                                                    aria-label="Xóa" 
                                                    data-apple-confirm="Bạn có chắc muốn xóa hoặc ngừng kinh doanh sản phẩm này?">
                                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                    <polyline points="3 6 5 6 21 6"></polyline>
                                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                                </svg>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</div>
</body>
</html>
