<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title layout:title-pattern="$CONTENT_TITLE - Admin Console">Admin Dashboard</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Apple Design Tokens & Admin Styles -->
  <link rel="stylesheet" th:href="@{/css/apple-design-tokens.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">

  <!-- Page-specific styles hook -->
  <th:block layout:fragment="styles"></th:block>
</head>
<body>

  <!-- Admin Main Wrapper: macOS Dark Sidebar + Main Area -->
  <div class="admin-wrapper">
    
    <!-- 1. Dark Sidebar Fragment -->
    <aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

    <!-- 2. Main Area (Topbar + Content + Footer) -->
    <div class="admin-main">
      
      <!-- Topbar Fragment -->
      <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

      <!-- Dynamic Page Content Slot -->
      <main layout:fragment="content" class="admin-content">
        <!-- Sub views inject content here -->
      </main>

      <!-- Footer Fragment -->
      <footer th:replace="~{admin/fragments/footer :: footer}"></footer>

    </div>

  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Admin Interactions JS -->
  <script th:src="@{/js/admin.js}"></script>

  <!-- Page-specific scripts hook -->
  <th:block layout:fragment="scripts"></th:block>
</body>
</html>
