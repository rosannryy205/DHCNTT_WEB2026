<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- 1. Apple Global Nav (44px, Pure Black #000000) -->
  <nav th:fragment="global-nav" class="navbar navbar-expand-lg apple-global-nav p-0">
    <div class="container-xl d-flex align-items-center justify-content-between h-100">
      
      <!-- Brand Logo -->
      <a class="nav-brand-logo" th:href="@{/}">
        <i class="bi bi-apple fs-5 me-2"></i>
        <span class="fw-semibold">DH Store</span>
      </a>

      <!-- Desktop Links (Spaced evenly, 12px SF Pro) -->
      <div class="d-none d-lg-flex align-items-center flex-grow-1 justify-content-center">
        <a class="nav-link" th:href="@{/}">Cửa hàng</a>
        <a class="nav-link" th:href="@{/}">Mac</a>
        <a class="nav-link" th:href="@{/}">iPad</a>
        <a class="nav-link" th:href="@{/}">iPhone</a>
        <a class="nav-link" th:href="@{/}">Watch</a>
        <a class="nav-link" th:href="@{/}">AirPods</a>
        <a class="nav-link" th:href="@{/}">Phụ kiện</a>
        <a class="nav-link" th:href="@{/}">Hỗ trợ</a>
      </div>

      <!-- Right Utility Cluster: Search, Cart badge, Admin link -->
      <div class="d-flex align-items-center gap-3">
        <a th:href="@{/}" class="text-white opacity-75 hover-opacity-100 text-decoration-none" title="Tìm kiếm">
          <i class="bi bi-search fs-6"></i>
        </a>
        <a th:href="@{/cart}" class="text-white opacity-75 hover-opacity-100 text-decoration-none position-relative" title="Túi hàng">
          <i class="bi bi-bag fs-6"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary" style="font-size: 10px; padding: 2px 5px;">2</span>
        </a>
        <a th:href="@{/admin}" class="btn-apple-dark btn-apple-sm-pill text-decoration-none" title="Vào trang quản trị">
          <i class="bi bi-shield-lock"></i>
          <span class="d-none d-sm-inline">Admin</span>
        </a>
      </div>

    </div>
  </nav>
</body>
</html>
