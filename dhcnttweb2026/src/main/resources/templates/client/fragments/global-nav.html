<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- 1. Apple Global Nav (44px, Pure Black #000000) -->
  <nav th:fragment="global-nav" class="navbar navbar-expand-lg apple-global-nav p-0">
    <div class="container-xl d-flex align-items-center justify-content-between h-100">
      
      <!-- IUH Store Brand Logo -->
      <div th:replace="~{fragments/brand-logo :: client-logo}"></div>

      <!-- Desktop Links (Spaced evenly, 12px SF Pro) -->
      <div class="d-none d-lg-flex align-items-center flex-grow-1 justify-content-center">
        <a class="nav-link" th:href="@{/products}">Cửa hàng</a>
        <a class="nav-link" th:href="@{/products(category='mac')}">Mac</a>
        <a class="nav-link" th:href="@{/products(category='ipad')}">iPad</a>
        <a class="nav-link" th:href="@{/products(category='iphone')}">iPhone</a>
        <a class="nav-link" th:href="@{/products(category='watch')}">Watch</a>
        <a class="nav-link" th:href="@{/products(category='airpods')}">AirPods</a>
        <a class="nav-link" th:href="@{/products(category='phu-kien')}">Phụ kiện</a>
        <a class="nav-link" th:href="@{/}">Hỗ trợ</a>
      </div>

      <!-- Right Utility Cluster: Search, Cart badge & Account -->
      <div class="d-flex align-items-center gap-3">
        <a th:href="@{/products}" class="text-white opacity-75 hover-opacity-100 text-decoration-none" title="Tìm kiếm">
          <i class="bi bi-search fs-6"></i>
        </a>

        <!-- Túi hàng (Bag) -->
        <a th:href="@{/bag}" class="text-white opacity-75 hover-opacity-100 text-decoration-none position-relative" title="Túi hàng">
          <i class="bi bi-bag fs-6"></i>
          <span id="globalNavBagBadge"
                th:text="${bagItemCount != null ? bagItemCount : 0}"
                th:style="${(bagItemCount != null and bagItemCount > 0) ? 'font-size: 10px; padding: 2px 5px;' : 'font-size: 10px; padding: 2px 5px; display: none;'}"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary">
          </span>
        </a>

        <!-- Khi chưa đăng nhập: Icon người dẫn đến trang login -->
        <a th:if="${currentCustomer == null}" 
           th:href="@{/login}" 
           class="text-white opacity-75 hover-opacity-100 text-decoration-none" 
           title="Đăng nhập tài khoản">
          <i class="bi bi-person fs-6"></i>
        </a>

        <!-- Khi đã đăng nhập: Dropdown menu kiểu Apple -->
        <div th:if="${currentCustomer != null}" class="dropdown">
          <button class="btn btn-link text-white opacity-85 hover-opacity-100 text-decoration-none p-0 d-flex align-items-center gap-1 dropdown-toggle" 
                  type="button" 
                  id="customerDropdown" 
                  data-bs-toggle="dropdown" 
                  aria-expanded="false" 
                  style="border: none; background: transparent; font-size: 13px;">
            <i class="bi bi-person-circle fs-6 text-primary"></i>
            <span class="d-none d-md-inline text-truncate" style="max-width: 100px;" th:text="${currentCustomer.name}">Khách hàng</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-lg py-2 mt-2" 
              aria-labelledby="customerDropdown"
              style="min-width: 230px; border-radius: 14px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.08); font-size: 13px;">
            <li class="px-3 py-2 border-bottom mb-1">
              <div class="fw-semibold text-dark text-truncate" th:text="${currentCustomer.name}">Tên Khách Hàng</div>
              <div class="text-muted small text-truncate" th:text="${currentCustomer.email}">email@example.com</div>
            </li>
            <li>
              <a class="dropdown-item py-2 d-flex align-items-center gap-2" th:href="@{/bag}">
                <i class="bi bi-bag text-primary"></i>
                <span>Túi hàng của tôi</span>
              </a>
            </li>
            <li>
              <a class="dropdown-item py-2 d-flex align-items-center gap-2 text-muted" href="javascript:void(0)" title="Tính năng sẽ sớm ra mắt">
                <i class="bi bi-box-seam"></i>
                <span>Đơn hàng của tôi (Sắp ra mắt)</span>
              </a>
            </li>
            <li><hr class="dropdown-divider my-1"></li>
            <li>
              <a class="dropdown-item py-2 text-danger d-flex align-items-center gap-2" th:href="@{/logout}">
                <i class="bi bi-box-arrow-right"></i>
                <span>Đăng xuất</span>
              </a>
            </li>
          </ul>
        </div>
      </div>

    </div>
  </nav>
</body>
</html>
