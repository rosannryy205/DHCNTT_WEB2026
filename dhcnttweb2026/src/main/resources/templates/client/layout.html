<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title layout:title-pattern="$CONTENT_TITLE - Apple Store">DH Store</title>

  <!-- Google Font: Inter (Closest open-source match to Apple SF Pro) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Apple Design System Tokens & Client Styles -->
  <link rel="stylesheet" th:href="@{/css/apple-design-tokens.css}">
  <link rel="stylesheet" th:href="@{/css/client.css}">

  <!-- Page-specific styles hook -->
  <th:block layout:fragment="styles"></th:block>
</head>
<body>

  <!-- 1. Apple Global Nav (44px pure black) -->
  <header th:replace="~{client/fragments/global-nav :: global-nav}"></header>

  <!-- 2. Apple Frosted Sub-Nav (52px sticky blur) -->
  <div th:replace="~{client/fragments/sub-nav :: sub-nav}"></div>

  <!-- 3. Dynamic Page Content Slot -->
  <main layout:fragment="content" class="min-vh-100">
    <!-- Child views inject content here -->
  </main>

  <!-- 4. Apple Parchment Footer -->
  <footer th:replace="~{client/fragments/footer :: footer}"></footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Client Interactions JS -->
  <script th:src="@{/js/client.js}"></script>

  <!-- Page-specific scripts hook -->
  <th:block layout:fragment="scripts"></th:block>
</body>
</html>
