<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — DHCNTT Web 2026 Admin'">Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-apple.css}"/>
</head>
<body>
<header th:fragment="topbar(pageTitle, subtitle)" class="sub-nav-frosted">
    <div class="sub-nav-inner">
        <div style="display:flex;align-items:baseline;gap:12px;">
            <h2 class="t-tagline" th:text="${pageTitle}">Dashboard</h2>
            <span class="t-fine-print" style="color:var(--color-ink-muted-48);" th:text="${subtitle}"></span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
            <a th:href="@{/admin/products}" class="text-link">Kho sản phẩm</a>
            <a th:href="@{/admin/products/add}" class="btn-primary-sm">+ Thêm sản phẩm</a>
            <a th:href="@{/admin/logout}" class="text-link" style="color:var(--color-ink-muted-48);">Đăng xuất</a>
        </div>
    </div>
</header>
</body>
</html>
