<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/header :: head('Chỉnh sửa sản phẩm')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/header :: topbar(${pageTitle}, ${subtitle})}"></header>
        <section class="tile-light">
            <div class="container-admin">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <a th:each="item : ${allProducts}"
                           th:href="@{/admin/products/edit/{id}(id=${item.id})}"
                           class="configurator-option-chip"
                           th:classappend="${item.id == product.id} ? 'selected'"
                           th:text="${item.name}"></a>
                    </div>
                    <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post">
                        <button type="submit" class="btn-dark-utility">Xóa sản phẩm này</button>
                    </form>
                </div>
                <form th:action="@{/admin/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post">
                    <div class="form-grid">
                        <div class="store-utility-card">
                            <div class="form-group">
                                <label class="form-label">Tên sản phẩm *</label>
                                <input type="text" th:field="*{name}" class="form-control" required/>
                            </div>
                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">Mã SKU *</label>
                                    <input type="text" th:field="*{sku}" class="form-control numeric" required/>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Danh mục *</label>
                                    <select th:field="*{category}" class="form-control">
                                        <option value="iPhone">iPhone</option>
                                        <option value="Mac">Mac</option>
                                        <option value="iPad">iPad</option>
                                        <option value="Phụ kiện">Phụ kiện</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">Giá niêm yết (VNĐ) *</label>
                                    <input type="number" th:field="*{price}" class="form-control numeric" min="0" step="10000" required/>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Số lượng tồn kho *</label>
                                    <input type="number" th:field="*{stock}" class="form-control numeric" min="0" required/>
                                </div>
                            </div>
                            <div class="form-row-2">
                                <div class="form-group">
                                    <label class="form-label">Trạng thái</label>
                                    <select th:field="*{status}" class="form-control">
                                        <option value="Đang bán">Đang bán</option>
                                        <option value="Sắp ra mắt">Sắp ra mắt</option>
                                        <option value="Tạm hết hàng">Tạm hết hàng</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">URL Ảnh Render PNG</label>
                                    <input type="url" th:field="*{imageUrl}" class="form-control"/>
                                </div>
                            </div>
                            <div class="form-group" style="margin-bottom:0;">
                                <label class="form-label">Mô tả Tagline</label>
                                <textarea th:field="*{tagline}" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="store-utility-card" style="background:var(--color-surface-pearl);text-align:center;">
                            <span class="t-fine-print" style="color:var(--color-primary);text-transform:uppercase;">Đang chỉnh sửa</span>
                            <img class="product-render-img" th:src="${product.imageUrl}" th:alt="${product.name}"/>
                            <h3 class="t-body-strong" th:text="${product.name}"></h3>
                            <p class="t-caption numeric" style="margin-top:8px;" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></p>
                        </div>
                    </div>
                    <div class="floating-sticky-bar">
                        <span class="t-body-strong" th:text="'Đang sửa: ' + ${product.name}"></span>
                        <div style="display:flex;gap:12px;">
                            <a th:href="@{/admin/products}" class="btn-secondary-pill">Hủy thay đổi</a>
                            <button type="submit" class="btn-primary">Cập nhật sản phẩm</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
</body>
</html>
