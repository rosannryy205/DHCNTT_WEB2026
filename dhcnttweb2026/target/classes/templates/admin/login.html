<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/header :: head('Đăng nhập Quản trị')}"></head>
<body class="login-page-body">

<header class="global-nav">
    <div class="global-nav-inner">
        <a th:href="@{/admin/login}" class="global-nav-link active" style="font-weight:600;color:#ffffff;">
             Store Admin Workspace
        </a>
        <span class="t-fine-print" style="color:var(--color-body-muted);">DHCNTT WEB 2026</span>
    </div>
</header>

<main class="login-wrapper">
    <div class="store-utility-card login-card">
        <div style="text-align:center;margin-bottom:28px;">
            <div class="login-logo-circle"></div>
            <p class="t-caption-strong" style="color:var(--color-primary);text-transform:uppercase;margin-top:16px;">
                Hệ thống Quản trị Cửa hàng
            </p>
            <h1 class="t-display-md" style="margin-top:4px;">Đăng nhập Admin.</h1>
            <p class="t-caption" style="color:var(--color-ink-muted-48);margin-top:6px;">
                Sử dụng tài khoản quản trị viên để truy cập Dashboard & Kho sản phẩm.
            </p>
        </div>

        <div th:if="${errorMessage}" class="login-alert login-alert-error">
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${logoutMessage}" class="login-alert login-alert-info">
            <span th:text="${logoutMessage}"></span>
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Nhập tên đăng nhập (admin)" value="admin" required autofocus/>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Nhập mật khẩu (123456)" required/>
            </div>

            <button type="submit" class="btn-primary" style="width:100%;margin-top:8px;">
                Đăng nhập vào hệ thống
            </button>
        </form>

        <div class="login-demo-hint">
            <span class="t-fine-print" style="color:var(--color-ink-muted-48);">
                Tài khoản mặc định: <strong>admin</strong> · Mật khẩu: <strong>123456</strong>
            </span>
        </div>
    </div>
</main>

<footer class="login-footer">
    <p class="t-fine-print" style="color:var(--color-ink-muted-48);">
        Copyright © 2026 DHCNTT Web 2026 — Apple Design System (SF Pro · Action Blue #0066cc).
    </p>
</footer>

</body>
</html>
